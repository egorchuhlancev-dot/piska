<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .my-link {
            color: #ff4757;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 2px solid #ff4757;
            transition: 0.2s;
        }
        .my-link:hover {
            color: #ff6b81;
            border-color: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Замените https://example.com на нужный вам адрес сайта -->
        <a href="https://kurhfd.com" target="_blank" class="my-link">Нажми для перехода 🥰</a>
    </div>

</body>
</html>
